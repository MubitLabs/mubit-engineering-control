name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint

  suite-a:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:a

  suite-b:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # §15: the UI evidence tests take real screenshots, the security evidence included (no channel
      # out of the page). Chromium's headless shell at the revision playwright-core pins, with its libraries.
      - run: pnpm --filter @mec/desktop exec playwright-core install --with-deps --only-shell chromium
      - run: pnpm test:b

  audit:
    name: audit — no known prod vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod

  compliance-guard:
    name: compliance — credential-path self-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run packages/slots/test/compliance-self.test.ts packages/slots/test/compliance.test.ts

  install-smoke:
    name: install — the tarball installs and answers on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:desktop
      - run: pnpm pack:internal
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: extract and install (natives build via their install scripts)
        run: |
          mkdir mec && tar xzf dist-internal/mec-*.tgz -C mec
          cd mec && npm install --omit=dev --no-audit --no-fund
      - name: the installed package serves its catalogue
        run: node scripts/smoke-package.mjs mec
      - name: version and doctor answer
        run: |
          cd mec
          node bin/mec.js --version
          node bin/mec.js doctor --json > doctor.json
          node -e "JSON.parse(require('node:fs').readFileSync('doctor.json','utf8'))"
      - name: the server answers healthz and serves the workbench
        run: |
          cd mec
          MEC_DATA_DIR="$(mktemp -d)" MEC_NO_OPEN=1 node bin/mec.js > server.log 2>&1 &
          pid=$!
          url=""
          for i in $(seq 1 30); do
            url=$(grep -o 'http://127\.0\.0\.1:[0-9]*' server.log | head -1 || true)
            [ -n "$url" ] && break
            sleep 1
          done
          [ -n "$url" ] || { cat server.log; exit 1; }
          curl -fsS "$url/healthz" | grep -q '"ok":true'
          curl -fsS "$url/" | grep -q '<div id="root">'
          kill $pid || true
