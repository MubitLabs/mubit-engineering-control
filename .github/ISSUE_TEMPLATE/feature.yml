name: Feature request
description: A capability MEC does not have, or a behaviour you want changed.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        MEC's behaviour of record is the spec — `docs/plan/PLAN_v4.1_local_meta_agent.md`.
        Some absence is deliberate: `docs/known-limits.md` lists what is designed-out, and
        `docs/STATUS.md` tracks what is not built yet. A one-line check of those two files
        saves everyone a round trip.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what stops you?
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: The change you would like
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds you tried
    validations:
      required: false
  - type: input
    id: spec
    attributes:
      label: Spec section, if you know it
      description: If the plan already discusses this area, the section number helps (e.g. §5.8).
    validations:
      required: false
