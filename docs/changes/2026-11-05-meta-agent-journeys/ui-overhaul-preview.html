</style></head><body><div class="prototype"><span><strong>Design prototype</strong> — synthetic examples, simulated actions only</span><span>No connection to MEC or your repositories</span></div><div class="shell"><aside class="rail" id="rail"><div class="brand"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>MEC</div><button class="repo-button" data-action="repos"><span class="repo-icon">R</span><span><strong class="repo-name">Repository console</strong><small>Local workspace</small></span><span class="chevron">⌄</span></button><nav class="nav-stack" aria-label="Workspace"><button class="nav-item active" data-nav="conversation"><svg viewBox="0 0 20 20"><path d="M4 4h12v9H9l-4 3v-3H4z"/></svg>Conversation</button><button class="nav-item" data-nav="work"><svg viewBox="0 0 20 20"><rect x="3.5" y="4" width="13" height="12" rx="2"/><path d="M7 3v3m6-3v3M6 9h8m-8 4h5"/></svg>Work</button><button class="nav-item" data-nav="needs"><svg viewBox="0 0 20 20"><path d="M10 3l7 13H3zM10 7v4m0 2v1"/></svg>Needs you<span class="count attention" id="needs-count">1</span></button></nav><div class="recent"><div class="recent-label">Recent work</div><button data-action="recent"><span class="recent-dot"></span>Add repository search</button><button data-action="history" class="muted">Improve empty states</button></div><div class="rail-foot"><nav class="nav-stack" aria-label="Configuration"><button class="nav-item" data-nav="connections">Connections</button><button class="nav-item" data-nav="setup">Setup</button><button class="nav-item" data-nav="settings">Settings</button></nav><div class="rail-bottom"><span class="connected">Local workspace</span><button class="icon-button" data-action="theme" aria-label="Switch to dark theme">◐</button></div></div></aside><div class="workspace"><header class="toolbar"><div class="breadcrumb"><button class="icon-button mobile-menu" data-action="menu" aria-label="Open navigation">☰</button><span class="repo-name">Repository console</span><span aria-hidden="true">/</span><strong id="route-name">Conversation</strong></div><div class="toolbar-actions"><select class="state-select" id="state" aria-label="Preview state"><option value="working">Working</option><option value="empty">Empty</option><option value="blocked">Blocked</option><option value="error">Error</option><option value="completed">Completed</option></select><button class="btn quiet" data-action="commands" aria-label="Open commands">⌘ K</button><button class="icon-button" data-action="inspect" aria-label="Open details">◫</button></div></header><div class="content-layout"><main class="screen" id="screen"></main><aside class="inspector" id="inspector" aria-label="Task details"><div class="inspector-head"><div><small>Add repository search</small><h2>Build the search experience</h2></div><button class="icon-button close-inspector" data-action="close-inspector" aria-label="Close details">×</button></div><div class="tabs" role="tablist" aria-label="Evidence"><button class="tab active" role="tab" aria-selected="true" data-tab="overview">Overview</button><button class="tab" role="tab" aria-selected="false" data-tab="checks">Checks</button><button class="tab" role="tab" aria-selected="false" data-tab="activity">Activity</button><button class="tab" role="tab" aria-selected="false" data-tab="diff">Diff</button></div><div class="inspector-body" id="evidence" role="tabpanel"></div></aside></div></div></div><div class="overlay" id="overlay" hidden><div class="dialog" id="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title" tabindex="-1"></div></div><div class="toast" id="toast" role="status" hidden></div><script>
const $=s=>document.querySelector(s);let route='conversation',repo='Repository console',state='working',tab='overview',opener=null,modalOpener=null,armed=false,approved=false,denied=false,armTimer,toastTimer,follow=false,settings='Prompts',inspectorContext='task',taskInspectorOpen=innerWidth>=1150;const drafts={};const icons={done:'✓',running:'',waiting:''};const task=(title,detail,status,kind)=>`<li><button class="task-row" data-action="inspect"><span class="task-indicator ${kind}">${icons[kind]||''}</span><span class="task-body"><strong>${title}</strong><small>${detail}</small></span><span class="task-state">${status}</span><span class="chevron">›</span></button></li>`;function plan(){return `<article class="delivery"><header class="delivery-head"><div><h2>Add repository search</h2><small>Three tasks, one coordinated delivery</small></div><span class="pill"><span class="dot"></span>${state==='completed'?'Local work complete':'Working locally'}</span></header><ul class="task-list">${task('Understand the repository','Planner has checked the existing search patterns','Complete','done')}${task('Build the search experience','Implementer is adding search and empty states',state==='completed'?'Complete':'In progress',state==='completed'?'done':'running')}${task('Run repository checks','Checks run on the integrated commit',state==='completed'?'Complete':'Waiting',state==='completed'?'done':'waiting')}</ul><footer class="delivery-foot"><span>No external changes without your approval</span><button class="text-button" data-nav="work">View work</button></footer></article>`}
function composer(){return `<div class="composer-wrap"><form class="composer" id="composer"><div class="compose-scope"><span>${follow?'Following up on <strong>Add repository search</strong>':'<strong>New request</strong> in '+repo}</span><button type="button" class="text-button" data-action="intent">${follow?'New request':'Follow up'}</button></div><textarea id="draft" aria-label="Message the meta agent" placeholder="What would you like to work on?">${escape(drafts[repo]||'')}</textarea><div class="composer-bottom"><small>You talk to the meta agent. It coordinates the work.</small><button class="btn primary send" aria-label="Send simulated message">↑</button></div></form><p class="composer-hint">Enter to send <span aria-hidden="true">&nbsp; </span> Shift + Enter for a new line</p></div>`}
function title(name,sub,action=''){return `<header class="page-title"><div><h1>${name}</h1><p>${sub}</p></div>${action}</header>`}function notice(){if(state==='blocked')return `<div class="notice blocked"><h3>One question before the next step</h3><p>Should search include archived repositories? The remaining local work can continue.</p><button class="btn" data-action="question">Answer question</button></div>`;if(state==='error')return `<div class="notice error"><h3>Work details could not be loaded</h3><p>Your conversation and draft are still here. Retry these details.</p><button class="btn" data-action="retry">Try again</button></div>`;if(state==='completed')return `<div class="notice"><h3>Local work is tested and ready</h3><p>Review the changes, then approve pushing the branch. No PR has been opened.</p><button class="btn" data-nav="needs">Review next step</button></div>`;return ''}
function conversation(){return `<section class="conversation">${title(state==='empty'?'Conversation':'Add repository search','Your meta agent, working in '+repo)}${state==='empty'?`<div class="empty"><h2>What would you like to build?</h2><p>Ask for an outcome. The meta agent will plan it, coordinate the specialists and bring you what needs a decision.</p><button class="btn" data-action="example">Try adding repository search</button></div>`:`<div class="message user"><p>Add repository search with clear empty states and keyboard support.</p></div><div class="message agent"><span class="byline">Meta agent</span><p>On it. I’ll add search that is easy to find, works from the keyboard and explains empty results.</p></div>${notice()}${plan()}<div class="activity-note"><span class="dot"></span><span>${state==='completed'?'The changes passed their checks. Waiting for your push approval.':'The implementation is underway. Repository checks follow implementation.'}</span></div>`}${composer()}</section>`}
function work(){return `<section class="page">${title('Work','The path from your request to a tested pull request.','<button class="btn" data-action="new">New request</button>')}${notice()}${state==='empty'?'<div class="empty"><h2>No work yet</h2><p>Start a request in this repository. Its plan, tasks and results will stay together here.</p><button class="btn" data-action="new">Start a request</button></div>':`<div class="list-header"><span>Current delivery</span><span>${repo}</span></div><button class="work-entry" data-action="inspect"><div><h2>Add repository search</h2><small>${state==='completed'?'Local work tested. Push approval is the next step.':'Implementing search. Repository checks follow.'}</small></div><span class="pill"><span class="dot"></span>${state==='completed'?'Awaiting approval':'Working'}</span></button><section class="task-section"><h3>Delivery plan</h3><p class="muted small" style="margin-bottom:20px">Tasks follow their dependencies. The meta agent manages the handoffs.</p><div class="dependency"><span>Understand the repository<br><small>Planner</small></span><span class="pill">✓ Complete</span></div><div class="dependency dependency-indent"><span><button class="text-button" data-action="inspect">Build the search experience</button><br><small>Depends on repository review</small></span><span class="pill">${state==='completed'?'Complete':'In progress'}</span></div><div class="dependency dependency-indent"><span>Run repository checks<br><small>Depends on implementation</small></span><span class="pill">${state==='completed'?'Complete':'Waiting'}</span></div></section><button class="btn" data-action="discuss">Discuss this work</button>`}</section>`}
function needs(){return `<section class="page">${title('Needs you','Only the decisions that need your attention.')}${state==='empty'?'<div class="empty"><h2>Nothing is waiting for you</h2><p>The meta agent will bring the next decision here, with the context to make it.</p></div>':`<article class="decision"><div class="decision-head"><span class="attention-label">${approved?'Resolved in prototype':'Push approval'}</span><small>${approved?'Simulated result only':'Expires in 23 minutes · example'}</small></div><h2>${approved?(denied?'Branch push denied':'Branch push approved'):'Push the tested search branch'}</h2><p>This makes the local branch available on the repository remote. Creating a pull request is a separate approval.</p><div class="evidence-summary"><dl style="margin:0"><div><dt>Repository</dt><dd>${repo}</dd></div><div><dt>Branch</dt><dd class="mono">feature/repository-search</dd></div><div><dt>Tested commit</dt><dd class="mono">7b34c91</dd></div><div><dt>Validation</dt><dd>Checks passed on this commit</dd></div></dl></div><div class="consequence"><strong>If you approve</strong><p>MEC pushes this exact branch and commit. It does not merge or deploy.</p></div><div class="consequence"><strong>If you deny</strong><p>The tested local changes stay available. Nothing is pushed.</p></div><button class="text-button" data-action="checks">Inspect checks and changes</button><div class="actions"><button class="btn primary" id="approve" data-action="approve" ${approved?'disabled':''}>${approved?(denied?'Denied (simulated)':'Approved (simulated)'):armed?'Confirm: push branch':'Approve push'}</button><button class="btn quiet" data-action="deny" ${approved?'disabled':''}>Deny</button></div><p class="small" style="margin-top:14px">${armed?'Armed for eight seconds. Escape or any other action cancels.':'Prototype only. No repository or network action will occur.'}</p></article>`}</section>`}
function connections(){return `<section class="page">${title('Connections','The coding agents available to your meta agent.','<button class="btn" data-action="add">Add connection</button>')}<div class="list-header"><span>Available connections</span><span>Local configuration</span></div><div class="form-row"><div><h3>Dedicated coding slot</h3><p>Claude Code<br>Subscription connection</p></div><span class="pill"><span class="dot green"></span>Healthy</span></div><div class="form-row"><div><h3>API coding slot</h3><p>OpenCode<br>No usage reading yet</p></div><button class="btn" data-action="validate">Validate</button></div><div class="notice" style="margin-top:28px"><h3>Credentials stay on this machine</h3><p>Use the vendor’s sign-in or the owner-entry key form. Keys never belong in the conversation.</p></div></section>`}
function setup(){return `<section class="page">${title('Set up your workspace','A few clear steps before the first request.')}<ol class="setup-steps">${[['Find your coding agents','Installed engines are checked locally.','Complete'],['Connect an agent','Use an existing login, a dedicated slot or an API connection.','Complete'],['Choose your repository','Confirm the source, check commands and trust level.','Complete'],['Choose the meta agent','Pick a healthy compatible connection for coordination.','Choose connection'],['Make your first request','Start when the required connections and repository are ready.','Open conversation']].map((x,i)=>`<li><span class="step-number">${i<3?'✓':i+1}</span><div><h3>${x[0]}</h3><p>${x[1]}</p>${i<3?'':`<button class="btn" ${i===4?'data-nav="conversation"':'data-action="add"'}>${x[2]}</button>`}</div></li>`).join('')}</ol></section>`}
function settingsView(){return `<section class="page">${title('Settings','Make the workspace fit the way you work.')}<nav class="settings-tabs" aria-label="Settings sections">${['Policy','Prompts','Models','Repositories','Backups'].map(s=>`<button class="${settings===s?'active':''}" data-settings="${s}">${s}</button>`).join('')}</nav>${settings==='Prompts'?`<div class="form-row" style="padding-top:0;border:0"><div><h3>Meta agent instructions</h3><p>Shipped default. Your saved revisions remain available.</p></div><button class="btn quiet" data-action="compare">Compare default</button></div><textarea class="editor" aria-label="Meta agent prompt">Plan the work around the user's outcome. Coordinate specialists and preserve their ownership. Ask the user only when their decision is needed. Explain results clearly and link to the evidence.</textarea><div class="actions"><small style="flex:1">Prototype editor · no settings are saved</small><button class="btn" data-action="save">Save revision</button></div>`:settings==='Policy'?`<div class="form-row"><div><h3>Local coding work</h3><p>The meta agent can plan and run local work under policy.</p></div><span class="pill">Automatic</span></div><div class="form-row"><div><h3>Push, pull request and merge</h3><p>Each external effect needs its own exact-action approval.</p></div><span class="pill">Ask first</span></div><div class="form-row"><div><h3>Default result</h3><p>Merge remains a separate decision.</p></div><span class="pill">Tested PR for review</span></div>`:settings==='Repositories'?`<div class="form-row"><div><h3>${repo}</h3><p>Conversation and work stay attached to this repository.</p></div><button class="btn" data-action="repos">Choose repository</button></div>`:settings==='Models'?`<div class="form-row"><div><h3>Balanced</h3><p>Bounded work with an established implementation path.</p></div><span class="pill">Assigned by the meta agent</span></div><div class="form-row"><div><h3>Strong</h3><p>Complex interfaces, coordination or consequential changes.</p></div><span class="pill">Reason recorded</span></div><p class="small" style="margin-top:24px">Actual resolved model, availability and usage belong in the attempt evidence.</p>`:`<div class="notice"><h3>No backup reading in this prototype</h3><p>Production must show a real completed backup and what it excludes. Unknown does not mean never.</p><button class="btn" data-action="backup">Review backup action</button></div>`}</section>`}
function render(){const fn={conversation,work,needs,connections,setup,settings:settingsView};$('#screen').innerHTML=fn[route]();$('#route-name').textContent=({conversation:'Conversation',work:'Work',needs:'Needs you',connections:'Connections',setup:'Setup',settings:'Settings'})[route];document.querySelectorAll('.repo-name').forEach(n=>n.textContent=repo);document.querySelectorAll('[data-nav]').forEach(n=>n.classList.toggle('active',n.dataset.nav===route));const d=$('#draft');if(d)d.addEventListener('input',()=>drafts[repo]=d.value);const f=$('#composer');if(f){f.addEventListener('submit',send);d.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send(e)}})}evidence()}
function evidence(){const approval=inspectorContext==='approval';$('.inspector-head h2').textContent=approval?'Push the tested search branch':'Build the search experience';$('.inspector-head small').textContent=approval?'Approval evidence · 7b34c91 (sample)':'Add repository search';document.querySelectorAll('[data-tab]').forEach(t=>{t.classList.toggle('active',t.dataset.tab===tab);t.setAttribute('aria-selected',t.dataset.tab===tab);t.tabIndex=t.dataset.tab===tab?0:-1});$('#evidence').innerHTML=tab==='overview'&&approval?`<h3>Exact effect</h3><p>Push branch feature/repository-search in ${repo}. Creating a PR and merging are separate decisions.</p><dl><div><dt>Tested commit</dt><dd class="mono">7b34c91 (sample)</dd></div><div><dt>Checks</dt><dd>Passed on this commit</dd></div><div><dt>Local changes</dt><dd>Preserved if denied</dd></div></dl><h3>Evidence bound to approval</h3><p>The checks and diff tabs show this exact tested revision, not a running task’s latest state.</p>`:tab==='overview'?`<h3>Current step</h3><p>Adding search and clear empty results. Repository checks follow implementation.</p><dl><div><dt>Role</dt><dd>Implementer</dd></div><div><dt>Requested tier</dt><dd>Balanced</dd></div><div><dt>Actual model</dt><dd>Sonnet (sample)</dd></div><div><dt>Engine</dt><dd>Claude Code (sample)</dd></div><div><dt>Connection</dt><dd>Coding slot (sample)</dd></div><div><dt>Last activity</dt><dd>Report just received (sample)</dd></div><div><dt>Depends on</dt><dd>Repository review</dd></div></dl><h3>Why this assignment</h3><p>A bounded interface change with existing patterns and checks. The requested tier and actual launch model are recorded separately.</p><h3>Acceptance</h3><p>Search is reachable by keyboard, empty results explain what to do next, and existing behavior keeps working.</p><button class="btn" data-action="discuss">Ask about this work</button>`:tab==='checks'&&!approval?`<h3>Checks have not run yet</h3><p>This task is still in progress. Repository checks will run on its completed commit; no earlier approval result applies here.</p><dl><div><dt>Task</dt><dd>Build the search experience</dd></div><div><dt>Current evidence</dt><dd>No tested commit yet</dd></div></dl>`:tab==='checks'?`<h3>Validation evidence</h3><p>Synthetic example on commit <code>7b34c91</code>. A running task never inherits another commit’s results.</p><div class="check"><span class="good">✓</span><span>Type and lint checks<br><small>Passed on the tested commit</small></span></div><div class="check"><span class="good">✓</span><span>Search behavior<br><small>Passed on the tested commit</small></span></div><div class="check"><span class="good">✓</span><span>Keyboard journey<br><small>Passed on the tested commit</small></span></div><hr class="separator"><p>Process completion, passing checks and delivered work are separate facts.</p>`:tab==='activity'?`<h3>Recorded activity</h3><p>Redacted actions and reports, not private model reasoning.</p><div class="timeline"><div><small>Just now</small>Implementation report received.</div><div><small>Earlier</small>Search behavior checks completed.</div><div><small>Earlier</small>Worktree created on the pinned base.</div><div><small>Earlier</small>Task assigned after repository review.</div></div>`:`<h3>Changes</h3><p>Synthetic diff preview.<br>Three files changed.</p><pre>src/search/Search.tsx\n<span class="added">+ Search input and results</span>\n\nsrc/search/EmptyState.tsx\n<span class="added">+ Clear empty result guidance</span>\n\ntest/search.test.tsx\n<span class="added">+ Keyboard and empty-state checks</span></pre><p style="margin-top:20px">Production evidence opens the exact tested revision.</p>`}
function nav(r){saveDraft();disarm();if(['conversation','work'].includes(route))taskInspectorOpen=!$('#inspector').hidden;route=r;const taskView=['conversation','work'].includes(route);const nextContext=taskView?'task':'approval';if(inspectorContext!==nextContext)tab='overview';inspectorContext=nextContext;$('#inspector').hidden=taskView?!taskInspectorOpen:true;const detailsButton=$('.toolbar [data-action="inspect"]');detailsButton.hidden=['settings','setup','connections'].includes(route);$('#rail').classList.remove('open');render();$('#screen').scrollTop=0}function saveDraft(){if($('#draft'))drafts[repo]=$('#draft').value}function inspect(t){if(['settings','setup','connections'].includes(route))return;opener=document.activeElement;const nextContext=route==='needs'?'approval':'task';if(inspectorContext!==nextContext)tab='overview';inspectorContext=nextContext;if(inspectorContext==='task')taskInspectorOpen=true;tab=t||'overview';$('#inspector').hidden=false;if(innerWidth<1150){$('#inspector').setAttribute('role','dialog');$('#inspector').setAttribute('aria-modal','true')}evidence();$('.close-inspector').focus()}function closeInspector(){ $('#inspector').hidden=true;if(inspectorContext==='task')taskInspectorOpen=false;if(opener&&opener.isConnected)opener.focus();else $('[data-action="inspect"]').focus() }function toast(t){clearTimeout(toastTimer);$('#toast').textContent=t;$('#toast').hidden=false;toastTimer=setTimeout(()=>$('#toast').hidden=true,4000)}function escape(t){return t.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function send(e){e.preventDefault();const d=$('#draft');if(!d||!d.value.trim())return;drafts[repo]='';d.value='';toast('Simulated message received. No coding work was started.')}function disarm(){clearTimeout(armTimer);if(armed){armed=false;if(route==='needs')render()}}function modal(title,body){disarm();modalOpener=document.activeElement;$('#dialog').innerHTML=`<div style="display:flex;justify-content:space-between;gap:12px"><h2 id="dialog-title">${title}</h2><button class="icon-button" data-action="close-modal" aria-label="Close dialog">×</button></div>${body}`;$('#overlay').hidden=false;$('#dialog').focus()}function closeModal(){ $('#overlay').hidden=true;if(modalOpener&&modalOpener.isConnected)modalOpener.focus() }
document.addEventListener('click',e=>{const b=e.target.closest('button');if(armed&&(!b||b.dataset.action!=='approve'))disarm();if(!b)return;if(b.dataset.nav)return nav(b.dataset.nav);if(b.dataset.tab){tab=b.dataset.tab;evidence();return}if(b.dataset.settings){settings=b.dataset.settings;render();return}if(b.dataset.repo){saveDraft();repo=b.dataset.repo;follow=false;closeModal();render();return}const a=b.dataset.action;if(a==='inspect')inspect();else if(a==='checks')inspect('checks');else if(a==='close-inspector')closeInspector();else if(a==='theme'){document.body.classList.toggle('dark');b.setAttribute('aria-label',document.body.classList.contains('dark')?'Switch to light theme':'Switch to dark theme')}else if(a==='menu')$('#rail').classList.toggle('open');else if(a==='repos')modal('Your repositories','<p>Each repository has its own meta conversation, work and draft.</p>'+['Repository console','Documentation site'].map(r=>`<button class="choice" data-repo="${r}"><span>${r}</span><small>${r===repo?'Selected':'Open workspace'}</small></button>`).join(''));else if(a==='commands')modal('Commands',['conversation','work','needs','connections','setup','settings'].map(r=>`<button class="choice" data-command="${r}">${({conversation:'Open conversation',work:'Open work',needs:'Open Needs you',connections:'Open connections',setup:'Open setup',settings:'Open settings'})[r]}<span>↵</span></button>`).join('')+'<button class="choice" data-action="theme">Change theme</button>');else if(b.dataset.command){closeModal();nav(b.dataset.command)}else if(a==='close-modal')closeModal();else if(a==='intent'){follow=!follow;render();$('#draft').focus()}else if(a==='discuss'){follow=true;nav('conversation');$('#draft').focus()}else if(a==='new'){follow=false;nav('conversation');$('#draft').focus()}else if(a==='recent'){nav('work');inspect()}else if(a==='history')toast('Synthetic history item. No repository was accessed.');else if(a==='example'){drafts[repo]='Add repository search with keyboard support.';render();$('#draft').focus()}else if(a==='retry'){state='working';$('#state').value=state;render();toast('Example details restored.')}else if(a==='question')modal('Search scope','<p>Should search include archived repositories? This is an unchanged specialist question relayed through the meta conversation.</p><button class="choice" data-answer="Active repositories only">Active repositories only</button><button class="choice" data-answer="Include archived repositories">Include archived repositories</button>');else if(b.dataset.answer){closeModal();toast('Simulated answer: '+b.dataset.answer)}else if(a==='approve'){if(!armed){armed=true;render();$('#approve').focus();armTimer=setTimeout(()=>{armed=false;if(route==='needs')render()},8000)}else{clearTimeout(armTimer);armed=false;approved=true;denied=false;$('#needs-count').textContent='0';render();toast('Simulated approval recorded. Nothing was pushed.')}}else if(a==='deny'){approved=true;denied=true;render();$('#approve').textContent='Denied (simulated)';$('#needs-count').textContent='0';toast('Simulated denial. Local work is retained.')}else if(a==='add')modal('Add connection','<p>Choose the connection path. This prototype never accepts credentials.</p><button class="choice" data-example="Existing login">Use an existing login</button><button class="choice" data-example="Dedicated slot">Sign in to a dedicated slot</button><button class="choice" data-example="API connection">Use an API connection</button>');else if(b.dataset.example){closeModal();toast(b.dataset.example+': prototype only. No sign-in was started.')}else if(a==='validate')toast('Simulated validation only. No engine was called.');else if(a==='save')toast('Prototype revision example. No settings were saved.');else if(a==='compare')modal('Compare with shipped default','<p>Your instructions and the shipped default appear side by side in production, with provenance and a preserved revision.</p><pre>No default changes in this synthetic example.</pre>');else if(a==='backup')toast('Prototype only. No backup action was submitted.')});
$('#state').addEventListener('change',e=>{saveDraft();disarm();state=e.target.value;render()});$('#overlay').addEventListener('click',e=>{if(e.target===$('#overlay'))closeModal()});document.addEventListener('keydown',e=>{const typing=e.target.matches('input,textarea,select');if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('[data-action="commands"]').click();return}if(e.key==='Escape'){if(!$('#overlay').hidden)closeModal();else if(armed)disarm();else if(!$('#inspector').hidden)closeInspector();else $('#rail').classList.remove('open');return}if(e.key==='/'&&!typing){e.preventDefault();nav('conversation');$('#draft').focus()}if(e.key==='Tab'&&$('#overlay').hidden&&!$('#inspector').hidden&&innerWidth<1150){const els=[...$('#inspector').querySelectorAll('button:not([tabindex="-1"])')],first=els[0],last=els[els.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}if(e.key==='Tab'&&!$('#overlay').hidden){const els=$('#dialog').querySelectorAll('button,input,[tabindex]'),first=els[0],last=els[els.length-1];if(e.shiftKey&&(document.activeElement===first||document.activeElement===$('#dialog'))){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}if(e.key==='ArrowRight'||e.key==='ArrowLeft'){const t=e.target.closest('[role="tab"]');if(t){e.preventDefault();const tabs=[...document.querySelectorAll('[data-tab]')],i=tabs.indexOf(t),next=tabs[(i+(e.key==='ArrowRight'?1:tabs.length-1))%tabs.length];tab=next.dataset.tab;evidence();next.focus()}}});render();if(innerWidth<1150)$('#inspector').hidden=true;
</script></body></html>
