name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mec
          POSTGRES_PASSWORD: mec
          POSTGRES_DB: mec
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mec" --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      MEC_TEST_DATABASE_URL: postgres://mec:mec@127.0.0.1:5432/mec
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
