name: release

# Review 2026-11-04 §3.2: a public repo needs a release artifact. On v* tags: the full
# gate, the tarball (with the workbench inside), a hosted-runner install smoke on both
# OSes, then the GitHub Release with the tarball (versioned + a stable `mec-latest.tgz`
# alias) and the install script.
# Publishing to npm is OWNER-GATED (DECISIONS #2/#4): the step below is ready but
# commented out — uncomment only after the owner records the decision.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: the tag is v plus the desktop version
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          [ "${GITHUB_REF_NAME}" = "v${version}" ] || { echo "tag ${GITHUB_REF_NAME} does not match apps/desktop version v${version}"; exit 1; }
      - run: pnpm check

  tarball:
    runs-on: ubuntu-latest
    needs: [check]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:desktop
      - run: pnpm pack:internal
      - uses: actions/upload-artifact@v4
        with:
          name: tarball
          path: dist-internal/mec-*.tgz
          if-no-files-found: error

  install-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    needs: [tarball]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: tarball, path: artifact }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: extract and install (natives build via their install scripts)
        run: |
          mkdir mec && tar xzf artifact/mec-*.tgz -C mec
          cd mec && npm install --omit=dev --no-audit --no-fund
      - name: the installed package serves its catalogue
        run: node scripts/smoke-package.mjs mec
      - name: version and doctor answer
        run: |
          cd mec
          node bin/mec.js --version
          node bin/mec.js doctor --json > doctor.json
          node -e "JSON.parse(require('node:fs').readFileSync('doctor.json','utf8'))"
      - name: the server answers healthz and serves the workbench
        run: |
          cd mec
          MEC_DATA_DIR="$(mktemp -d)" MEC_NO_OPEN=1 node bin/mec.js > server.log 2>&1 &
          pid=$!
          url=""
          for i in $(seq 1 30); do
            url=$(grep -o 'http://127\.0\.0\.1:[0-9]*' server.log | head -1 || true)
            [ -n "$url" ] && break
            sleep 1
          done
          [ -n "$url" ] || { cat server.log; exit 1; }
          curl -fsS "$url/healthz" | grep -q '"ok":true'
          curl -fsS "$url/" | grep -q '<div id="root">'
          kill $pid || true

  release:
    runs-on: ubuntu-latest
    needs: [install-smoke]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: tarball, path: artifact }
      - name: release with artifacts (versioned tarball + stable alias + install script)
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifact/mec-*.tgz
            scripts/install.sh
          generate_release_notes: true
      - name: stable mec-latest.tgz alias
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp artifact/mec-*.tgz mec-latest.tgz
          gh release upload "${GITHUB_REF_NAME}" mec-latest.tgz --clobber
      # OWNER-GATED (DECISIONS #2/#4): uncomment after the owner records the decision.
      # - uses: actions/setup-node@v4
      #   with: { node-version: 22, registry-url: 'https://registry.npmjs.org' }
      # - run: npm publish --access public
      #   env:
      #     NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
